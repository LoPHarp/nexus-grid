name: build-client
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    paths: ["nexus/**", "web/**", "client.py", "tools/build_client.sh", "requirements*.txt", ".github/workflows/build-client.yml"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Qt runtime libraries (Linux build only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libglib2.0-0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_core.py tests/test_image.py
        if: matrix.os == 'ubuntu-latest'
      - shell: bash
        run: PYTHON=python tools/build_client.sh
      - shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then mv dist/nexus-worker.exe dist/nexus-worker-Windows.exe
          else mv dist/nexus-worker dist/nexus-worker-$RUNNER_OS; fi
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-worker-${{ matrix.os }}
          path: dist/*
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: "dist/*" }
